  <button class="btn-copy" id="btnCopy" onclick="copiarAssinatura()">
    📋 Copiar Assinatura
  </button>

  <script>
    async function copiarAssinatura() {
      const btn = document.getElementById('btnCopy');
      const area = document.getElementById('signature-area');

      try {
        const range = document.createRange();
        range.selectNode(area);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);

        await navigator.clipboard.write([
          new ClipboardItem({
            'text/html': new Blob([area.innerHTML], { type: 'text/html' }),
            'text/plain': new Blob([area.innerText], { type: 'text/plain' })
          })
        ]);

        btn.classList.add('copied');
        btn.textContent = '✅ Assinatura Copiada!';
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.textContent = '📋 Copiar Assinatura';
        }, 3000);

        selection.removeAllRanges();
      } catch (error) {
        try {
          const range = document.createRange();
          range.selectNode(area);
          const selection = window.getSelection();
          selection.removeAllRanges();
          selection.addRange(range);
          document.execCommand('copy');
          selection.removeAllRanges();

          btn.classList.add('copied');
          btn.textContent = '✅ Assinatura Copiada!';
          setTimeout(() => {
            btn.classList.remove('copied');
            btn.textContent = '📋 Copiar Assinatura';
          }, 3000);
        } catch (e) {
          alert('Não foi possível copiar. Selecione manualmente com Ctrl+A e Ctrl+C.');
        }
      }
    }
