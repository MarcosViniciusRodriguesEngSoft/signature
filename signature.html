  <button class="btn-copy" id="btnCopy" onclick="copiarAssinatura()">
    📋 Copiar Assinatura
  </button>

  <script>
    async function copiarAssinatura() {
      const btn = document.getElementById('btnCopy');
      const tabela = document.querySelector('#signature-area > table');

      const mostrarCopiado = () => {
        btn.classList.add('copied');
        btn.textContent = '✅ Assinatura Copiada!';
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.textContent = '📋 Copiar Assinatura';
        }, 3000);
      };

      const selecionar = () => {
        const range = document.createRange();
        range.selectNode(tabela);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        return selection;
      };

      let selection;
      try {
        selection = selecionar();
        await navigator.clipboard.write([
          new ClipboardItem({
            'text/html': new Blob([tabela.outerHTML], { type: 'text/html' }),
            'text/plain': new Blob([tabela.innerText], { type: 'text/plain' })
          })
        ]);
        mostrarCopiado();
      } catch (error) {
        try {
          selection = selecionar();
          document.execCommand('copy');
          mostrarCopiado();
        } catch (e) {
          alert('Não foi possível copiar. Selecione manualmente com Ctrl+A e Ctrl+C.');
        }
      } finally {
        if (selection) selection.removeAllRanges();
      }
    }
  </script>
